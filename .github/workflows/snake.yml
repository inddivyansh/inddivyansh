name: Update contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  workflow_dispatch:          # manual "Run workflow" button
  push:
    branches: [main]
    paths: ["tools/generate_snake.py"]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate snake from the last 4 months of contributions
        run: python tools/generate_snake.py "${{ github.repository_owner }}"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake/snake.svg
          git diff --staged --quiet || git commit -m "chore: refresh contribution snake"
          git push
