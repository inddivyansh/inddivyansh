<svg xmlns="http://www.w3.org/2000/svg" width="420" height="190" viewBox="0 0 420 190" role="img" aria-label="CodeChef stats" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .t{font-family:'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif}
    .title{font-size:16px;font-weight:700;fill:#c0caf5}
    .handle{font-size:12px;fill:#7aa2f7}
    .rating{font-size:44px;font-weight:800;fill:#3fb950}
    .lab{font-size:11px;fill:#787c99;letter-spacing:1px}
    .sv{font-size:14px;font-weight:700;fill:#c0caf5}
    .sl{font-size:10px;fill:#787c99}
    .tier{font-size:12px;font-weight:700;fill:#1a1b27}
    .fade{opacity:0;animation:f .8s ease forwards}
    .d1{animation-delay:.1s}.d2{animation-delay:.35s}.d3{animation-delay:.6s}
    @keyframes f{to{opacity:1}}
  </style>
  <rect x="0.5" y="0.5" width="419" height="189" rx="10" fill="#1a1b27" stroke="#2f334d"/>
  <g class="t fade d1">
    <text x="22" y="34" class="title">CodeChef</text>
    <text x="22" y="52" class="handle">@divyanshindian</text>
    <rect x="308" y="18" width="90" height="24" rx="12" fill="#3fb950"/>
    <text x="353" y="34.5" text-anchor="middle" class="tier">2 Star</text>
  </g>
  <g class="t fade d2">
    <text x="22" y="105" class="rating">1570</text>
    <text x="22" y="122" class="lab">CURRENT RATING</text>
    <text x="190" y="84" class="sv">2</text><text x="190" y="98" class="sl">Stars</text>
    <text x="190" y="120" class="sv">1621</text><text x="190" y="134" class="sl">Starters 225 rank</text>
    <text x="300" y="84" class="sv">1600</text><text x="300" y="98" class="sl">Next: 3 Star</text>
  </g>
  <g class="t fade d3">
    <text x="22" y="157" class="sl">Progress to 3 Star (30 points to go)</text>
    <rect x="22" y="165" width="376" height="7" rx="3.5" fill="#2f334d"/>
    <rect x="22" y="165" width="0" height="7" rx="3.5" fill="#3fb950">
      <animate attributeName="width" from="0" to="320" dur="1.2s" begin="0.6s" fill="freeze"/>
    </rect>
  </g>
</svg>
